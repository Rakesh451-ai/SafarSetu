# Render Blueprint Specification for SafarSetu
services:
  # 1. Main ASGI Web Application (HTTP + WebSockets + PWA)
  - type: web
    name: safarsetu-web
    runtime: python
    region: singapore
    plan: starter
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT safarsetu.asgi:application"
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: safarsetu.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: safarsetu-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safarsetu-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: safarsetu-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: safarsetu-redis
          property: connectionString
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"

  # 2. Celery Async Task Worker (Default + SOS High-Priority Queues)
  - type: worker
    name: safarsetu-worker
    runtime: python
    region: singapore
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A safarsetu worker -l INFO -Q default,sos -c 2"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: safarsetu.settings.prod
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: safarsetu-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: safarsetu-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safarsetu-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: safarsetu-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: safarsetu-redis
          property: connectionString

  # 3. Celery Beat Periodic Scheduler (Missed Check-in Monitor)
  - type: worker
    name: safarsetu-beat
    runtime: python
    region: singapore
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A safarsetu beat -l INFO"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: safarsetu.settings.prod
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: safarsetu-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: safarsetu-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safarsetu-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: safarsetu-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: safarsetu-redis
          property: connectionString

  # 4. Redis In-Memory Store for Channels & Celery
  - type: redis
    name: safarsetu-redis
    region: singapore
    plan: starter
    maxmemoryPolicy: noeviction
    ipAllowList: []

# 5. PostgreSQL Database
databases:
  - name: safarsetu-postgres
    region: singapore
    plan: starter
    databaseName: safarsetu
    user: safarsetu_user
