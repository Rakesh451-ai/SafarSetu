services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safarsetu_web
    command: daphne -b 0.0.0.0 -p 8000 safarsetu.asgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=safarsetu.settings.dev
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=django-insecure-safarsetu-super-secret-dev-key-2026!
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,web
      - DATABASE_URL=postgres://safarsetu_user:safarsetu_password@db:5432/safarsetu
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CORS_ALLOW_ALL_ORIGINS=True
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker_default:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safarsetu_worker_default
    command: celery -A safarsetu worker -l INFO -Q default -c 2 -n default_worker@%h
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=safarsetu.settings.dev
      - DJANGO_SECRET_KEY=django-insecure-safarsetu-super-secret-dev-key-2026!
      - DATABASE_URL=postgres://safarsetu_user:safarsetu_password@db:5432/safarsetu
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker_sos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safarsetu_worker_sos
    command: celery -A safarsetu worker -l INFO -Q sos -c 4 -n sos_worker@%h
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=safarsetu.settings.dev
      - DJANGO_SECRET_KEY=django-insecure-safarsetu-super-secret-dev-key-2026!
      - DATABASE_URL=postgres://safarsetu_user:safarsetu_password@db:5432/safarsetu
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safarsetu_beat
    command: celery -A safarsetu beat -l INFO
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=safarsetu.settings.dev
      - DJANGO_SECRET_KEY=django-insecure-safarsetu-super-secret-dev-key-2026!
      - DATABASE_URL=postgres://safarsetu_user:safarsetu_password@db:5432/safarsetu
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    container_name: safarsetu_db
    environment:
      - POSTGRES_DB=safarsetu
      - POSTGRES_USER=safarsetu_user
      - POSTGRES_PASSWORD=safarsetu_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safarsetu_user -d safarsetu"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: safarsetu_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
