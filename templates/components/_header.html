{% load static %}
<header class="app-header">
  <div class="header-left">
    <button class="drawer-trigger" id="btn-open-drawer" aria-label="Open Navigation Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <a href="{% url 'web:home' %}" class="brand-wrapper">
      <div class="brand-emblem">🇮🇳</div>
      <div class="brand-title">
        <span>SafarSetu</span>
        <span class="sub">Ministry of Tourism</span>
      </div>
    </a>
  </div>
  <div class="header-right">
    <button class="lang-btn" id="btn-open-lang" aria-label="Change Language">
      🌐 EN
    </button>
    {% if user.is_authenticated %}
      <a href="{% url 'web:profile' %}" style="text-decoration:none;" aria-label="My Account">
        <div style="width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg, var(--gov-gold), #92400E); color:#071326; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; border:1.5px solid #FFFFFF;">
          {{ user.first_name|default:user.username|slice:":1"|upper }}{{ user.last_name|default:""|slice:":1"|upper }}
        </div>
      </a>
    {% else %}
      <a href="{% url 'web:login' %}" style="background:var(--gov-gold); color:#071326; font-size:11px; font-weight:700; padding:4px 10px; border-radius:20px; text-decoration:none; display:flex; align-items:center; gap:3px;">
        <span>Sign In</span>
      </a>
    {% endif %}
    <a href="{% url 'web:radar' %}" class="notif-btn" aria-label="Notifications and Alerts">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notif-badge"></span>
    </a>
  </div>
</header>
