# fly.toml app configuration file for SafarSetu
app = "safarsetu"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python manage.py migrate --noinput"

[env]
  DJANGO_SETTINGS_MODULE = "safarsetu.settings.prod"
  DJANGO_DEBUG = "False"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health/"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
