# Nginx Configuration for SafarSetu (HTTP + WebSocket + Static Files)
upstream safarsetu_server {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name localhost safarsetu.local;

    client_max_body_size 20M;

    # Static files
    location /static/ {
        alias /home/rakesh/SafarSetu/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media files
    location /media/ {
        alias /home/rakesh/SafarSetu/media/;
        expires 30d;
    }

    # ASGI / Daphne Proxy (HTTP & WebSockets)
    location / {
        proxy_pass http://safarsetu_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
