[project]
name = "safarsetu"
version = "0.1.0"
description = "SafarSetu - Modular Monolith Backend API for Tourism, Tracking, SOS & Assistance"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "SafarSetu Team", email = "dev@safarsetu.com" }
]
dependencies = [
    "Django==5.1.6",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "PyJWT==2.9.0",
    "qrcode==7.4.2",
    "pillow==10.4.0",
    "drf-spectacular==0.28.0",
    "django-cors-headers==4.7.0",
    "django-environ==0.12.0",
    "psycopg2-binary==2.9.10",
    "redis==5.2.1",
    "gunicorn==23.0.0",
    "whitenoise==6.8.2",
]

[project.optional-dependencies]
dev = [
    "black==25.1.0",
    "isort==6.0.0",
    "flake8==7.1.1",
    "pre-commit==4.1.0",
    "pytest==8.3.4",
    "pytest-django==4.9.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.system_generated
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".venv", "migrations", ".git"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "safarsetu.settings.dev"
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "--tb=short -ra"
