services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safarsetu_prod_web
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 safarsetu.asgi:application"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=safarsetu.settings.prod
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - DATABASE_URL=postgres://${POSTGRES_USER:-safarsetu_user}:${POSTGRES_PASSWORD:-safarsetu_password}@db:5432/${POSTGRES_DB:-safarsetu}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS:-False}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  worker_default:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safarsetu_prod_worker_default
    command: celery -A safarsetu worker -l INFO -Q default -c 2 -n default_worker@%h
    environment:
      - DJANGO_SETTINGS_MODULE=safarsetu.settings.prod
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - DATABASE_URL=postgres://${POSTGRES_USER:-safarsetu_user}:${POSTGRES_PASSWORD:-safarsetu_password}@db:5432/${POSTGRES_DB:-safarsetu}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  worker_sos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safarsetu_prod_worker_sos
    command: celery -A safarsetu worker -l INFO -Q sos -c 4 -n sos_worker@%h
    environment:
      - DJANGO_SETTINGS_MODULE=safarsetu.settings.prod
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - DATABASE_URL=postgres://${POSTGRES_USER:-safarsetu_user}:${POSTGRES_PASSWORD:-safarsetu_password}@db:5432/${POSTGRES_DB:-safarsetu}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safarsetu_prod_beat
    command: celery -A safarsetu beat -l INFO
    environment:
      - DJANGO_SETTINGS_MODULE=safarsetu.settings.prod
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}
      - DATABASE_URL=postgres://${POSTGRES_USER:-safarsetu_user}:${POSTGRES_PASSWORD:-safarsetu_password}@db:5432/${POSTGRES_DB:-safarsetu}
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  db:
    image: postgis/postgis:16-3.4
    container_name: safarsetu_prod_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-safarsetu}
      - POSTGRES_USER=${POSTGRES_USER:-safarsetu_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-safarsetu_password}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safarsetu_user} -d ${POSTGRES_DB:-safarsetu}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: safarsetu_prod_redis
    volumes:
      - redis_prod_data:/data
    restart: always

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
